{% extends "base.html" %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="card auth-card shadow-lg">
                <div class="card-body p-5">
                    <div class="text-center mb-4">
                        <h2 class="fw-bold" style="color: var(--brand-primary);">Welcome Back</h2>
                        <p class="text-muted">Sign in to access the Analyst Dashboard</p>
                    </div>

                    <form method="POST">
                        <div class="mb-3">
                            <label class="form-label fw-bold">Username</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light"><i class="bi bi-person"></i></span>
                                <input type="text" name="username" class="form-control" placeholder="Enter your username" required autofocus>
                            </div>
                        </div>
                        <div class="mb-4">
                            <label class="form-label fw-bold">Password</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light"><i class="bi bi-lock"></i></span>
                                <input type="password" name="password" class="form-control" placeholder="••••••••" required>
                            </div>
                        </div>
                        <button type="submit" class="btn btn-brand w-100 py-2">Sign In</button>
                    </form>
                </div>
                <div class="card-footer bg-light text-center py-3">
                    <small>Don't have an account? <a href="{{ url_for('auth.signup') }}" class="fw-bold text-decoration-none" style="color: var(--brand-accent);">Sign Up</a></small>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
